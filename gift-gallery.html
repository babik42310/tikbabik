<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Galerie Cadeaux TikTok</title>

<style>
body{
    background:#1f1f1f;
    color:white;
    font-family:Arial;
    padding:30px;
}

h1{
    color:#ff0050;
    text-align:center;
}

#giftGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:20px;
}

.giftCard{
    background:#2b2b2b;
    border:1px solid #ff0050;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.giftCard img{
    width:70px;
    height:70px;
    object-fit:contain;
}

.coins{
    color:gold;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🎁 Galerie des Cadeaux TikTok</h1>

<div id="giftGrid"></div>

<script>
async function loadGifts(){

    const response = await fetch("/gift-library");
    const gifts = await response.json();
    console.log(gifts);

    const grid = document.getElementById("giftGrid");
    grid.innerHTML = "";

    gifts.forEach(gift => {

        const card = document.createElement("div");
        card.className = "giftCard";

        const image =
            gift.image || gift.giftPictureUrl || "";

        const name =
            gift.name || gift.giftName || "Sans nom";

        const coins =
            gift.diamonds || gift.diamondCount || gift.value || 0;

        card.innerHTML =
            "<img src='" + image + "'>" +
            "<h3>" + name + "</h3>" +
            "<div class='coins'>" +
            coins +
            " 🪙</div>";

        grid.appendChild(card);

    });

}

loadGifts();
</script>;
</script>

</body>
</html>
